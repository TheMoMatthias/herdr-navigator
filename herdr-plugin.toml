id = "momatthias.navigator"
name = "Navigator"
version = "0.16.3"
min_herdr_version = "0.9.3"
description = "Clickable navigator for herdr: projects, worktrees, every agent and sub-agent (in herdr or not), cross-CLI session resume, project-grouped sidebar, key hints"
platforms = ["linux", "macos", "windows"]

# Creates .venv with Textual + tomlkit (Python 3.11+ required).
[[build]]
platforms = ["windows"]
command = ["python", "bootstrap.py"]

[[build]]
platforms = ["linux", "macos"]
command = ["python3", "bootstrap.py"]

# After a server (re)start: resume each recorded agent pane (named, with its launch options),
# then re-report sidebar metadata and show the "press F1" hint.

[[startup]]
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "restore", "startup"]

[[startup]]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "restore", "startup"]

[[events]]
on = "workspace.created"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "hook"]

[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "hook"]

[[events]]
on = "pane.agent_detected"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "hook"]

[[events]]
on = "pane.agent_detected"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "hook"]

[[events]]
on = "pane.closed"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "hook"]

[[events]]
on = "pane.closed"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "hook"]

[[actions]]
id = "setup"
title = "Navigator: install keys, status bar and sidebar layout into config.toml"
contexts = ["workspace"]
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "setup", "install"]

[[actions]]
id = "setup-unix"
title = "Navigator: install keys, status bar and sidebar layout into config.toml"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "setup", "install"]

[[actions]]
id = "uninstall-config"
title = "Navigator: remove everything setup added to config.toml"
contexts = ["workspace"]
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "setup", "uninstall"]

[[actions]]
id = "uninstall-config-unix"
title = "Navigator: remove everything setup added to config.toml"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "setup", "uninstall"]

[[actions]]
id = "sync"
title = "Navigator: refresh sidebar labels"
contexts = ["workspace"]
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "hook"]

[[actions]]
id = "sync-unix"
title = "Navigator: refresh sidebar labels"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "sync"]

[[panes]]
id = "navigator"
title = "Navigator"
placement = "popup"
width = "94%"
height = "90%"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "app", "projects"]

[[panes]]
id = "navigator-unix"
title = "Navigator"
placement = "popup"
width = "94%"
height = "90%"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "app", "projects"]

[[panes]]
id = "resume"
title = "Resume a session"
placement = "popup"
width = "94%"
height = "90%"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "app", "resume"]

[[panes]]
id = "resume-unix"
title = "Resume a session"
placement = "popup"
width = "94%"
height = "90%"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "app", "resume"]

[[panes]]
id = "agents"
title = "All agents"
placement = "popup"
width = "94%"
height = "90%"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "app", "agents"]

[[panes]]
id = "agents-unix"
title = "All agents"
placement = "popup"
width = "94%"
height = "90%"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "app", "agents"]

[[panes]]
id = "keys"
title = "Key bindings"
placement = "popup"
width = "94%"
height = "90%"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "app", "keys"]

[[panes]]
id = "keys-unix"
title = "Key bindings"
placement = "popup"
width = "94%"
height = "90%"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "app", "keys"]

# Stand-in for an agent session running in another terminal (opened by the Navigator).
[[panes]]
id = "mirror"
title = "Mirror of an outside session"
placement = "tab"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "mirror"]

[[panes]]
id = "mirror-unix"
title = "Mirror of an outside session"
placement = "tab"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "mirror"]

# Recent places (every pane you focus) and agent status changes reach the daemon over its event
# subscription: no hook process per focus or status change.
[[actions]]
id = "next-attention"
title = "Navigator: jump to the next agent that needs you"
contexts = ["workspace"]
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "attention", "next"]

[[actions]]
id = "next-attention-unix"
title = "Navigator: jump to the next agent that needs you"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "attention", "next"]

[[events]]
on = "worktree.created"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "hook"]

[[events]]
on = "worktree.created"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "hook"]

[[events]]
on = "worktree.opened"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "hook"]

[[events]]
on = "worktree.opened"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "hook"]

[[events]]
on = "worktree.removed"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "hook"]

[[events]]
on = "worktree.removed"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "hook"]

[[events]]
on = "workspace.closed"
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "hook"]

[[events]]
on = "workspace.closed"
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "hook"]

# herdr's workspace menu: start a new agent session in that workspace's project (or worktree).
[[actions]]
id = "new-here"
title = "Navigator: new agent session here…"
contexts = ["workspace"]
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "newhere"]

[[actions]]
id = "new-here-unix"
title = "Navigator: new agent session here…"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "newhere"]


# herdr's Agents panel is a tree by project: fold or unfold one (right-click a pane or a workspace)
[[actions]]
id = "fold"
title = "Navigator: fold / unfold this project in the sidebar"
contexts = ["pane", "workspace"]
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "fold"]

[[actions]]
id = "fold-unix"
title = "Navigator: fold / unfold this project in the sidebar"
contexts = ["pane", "workspace"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "fold"]

[[actions]]
id = "fold-all"
title = "Navigator: fold / unfold every project in the sidebar"
contexts = ["pane", "workspace"]
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "fold", "all"]

[[actions]]
id = "fold-all-unix"
title = "Navigator: fold / unfold every project in the sidebar"
contexts = ["pane", "workspace"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "fold", "all"]

# /compact with your saved instructions ([compact] in navigator.toml): right-click a pane, or prefix+shift+c
[[actions]]
id = "compact"
title = "Navigator: compact this agent (with your instructions)"
contexts = ["pane", "workspace"]
platforms = ["windows"]
command = ["cmd.exe", "/d", "/c", "run.cmd", "compact"]

[[actions]]
id = "compact-unix"
title = "Navigator: compact this agent (with your instructions)"
contexts = ["pane", "workspace"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "compact"]

